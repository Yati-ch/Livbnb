[build]
  command = "echo 'No build step required'"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "zisi"
  included_files = ["views/**", "public/**"]

# Static assets in /public are served directly; every other request goes to Express
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app/:splat"
  status = 200
